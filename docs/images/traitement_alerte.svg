<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Traitement d'une alerte dans Odoo</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/>
    </marker>
    <style>
      .t { font-size: 13.5px; font-weight: 700; fill: #1F2933; }
      .x { font-size: 11.5px; fill: #3E4C59; }
      .l { font-size: 11.5px; font-weight: 700; fill: #1F2933; }
      .flux { stroke: #1F2933; stroke-width: 1.8; fill: none; }
    </style>
  </defs>
  <rect width="1000" height="610" fill="#FFFFFF"/>
  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2933">Traitement d'une alerte reçue par l'API</text>

  <!-- Ligne 1 -->
  <rect x="40" y="60" width="260" height="70" rx="9" fill="#FFF4E0" stroke="#E69A28" stroke-width="1.8"/>
  <text x="170" y="88" text-anchor="middle" class="t">Chaîne Big Data</text>
  <text x="170" y="108" text-anchor="middle" class="x">ou script de test envoyer_alerte.py</text>

  <rect x="360" y="60" width="280" height="70" rx="9" fill="#EEF4FB" stroke="#2B6CB0" stroke-width="1.8"/>
  <text x="500" y="88" text-anchor="middle" class="t">XML-RPC · execute_kw</text>
  <text x="500" y="108" text-anchor="middle" class="x">predimaint.alert.create_from_api(vals)</text>

  <rect x="700" y="45" width="260" height="105" rx="9" fill="#EEF4FB" stroke="#2B6CB0" stroke-width="1.8"/>
  <text x="830" y="68" text-anchor="middle" class="t">Contrôles</text>
  <text x="830" y="88" text-anchor="middle" class="x">champs autorisés seulement</text>
  <text x="830" y="105" text-anchor="middle" class="x">équipement trouvé (sensor_ref)</text>
  <text x="830" y="122" text-anchor="middle" class="x">gravité fournie, ou calculée</text>
  <text x="830" y="139" text-anchor="middle" class="x">avec les seuils de la catégorie</text>

  <rect x="700" y="190" width="260" height="60" rx="9" fill="#E8F6EE" stroke="#2E9E5B" stroke-width="1.8"/>
  <text x="830" y="215" text-anchor="middle" class="t">Alerte créée · ALR000x</text>
  <text x="830" y="235" text-anchor="middle" class="x">état « Nouvelle »</text>

  <!-- Décision 1 -->
  <polygon points="500,175 600,220 500,265 400,220" fill="#FFFBEA" stroke="#D9A400" stroke-width="1.8"/>
  <text x="500" y="216" text-anchor="middle" class="t">Gravité</text>
  <text x="500" y="233" text-anchor="middle" class="t">critique ?</text>

  <rect x="40" y="190" width="230" height="60" rx="9" fill="#F4F6F8" stroke="#8A94A0" stroke-width="1.6"/>
  <text x="155" y="215" text-anchor="middle" class="t">Reste une simple alerte</text>
  <text x="155" y="235" text-anchor="middle" class="x">(gravité surveillance)</text>

  <!-- Décision 2 -->
  <polygon points="500,305 615,350 500,395 385,350" fill="#FFFBEA" stroke="#D9A400" stroke-width="1.8"/>
  <text x="500" y="346" text-anchor="middle" class="t">Demande ouverte</text>
  <text x="500" y="363" text-anchor="middle" class="t">pour la machine ?</text>

  <rect x="40" y="320" width="230" height="60" rx="9" fill="#F4F6F8" stroke="#8A94A0" stroke-width="1.6"/>
  <text x="155" y="345" text-anchor="middle" class="t">Rattachée à la demande</text>
  <text x="155" y="365" text-anchor="middle" class="x">existante : pas de doublon</text>

  <rect x="700" y="300" width="260" height="105" rx="9" fill="#E8F6EE" stroke="#2E9E5B" stroke-width="1.8"/>
  <text x="830" y="323" text-anchor="middle" class="t">Demande prédictive créée</text>
  <text x="830" y="344" text-anchor="middle" class="x">étape « Nouvelle demande »</text>
  <text x="830" y="361" text-anchor="middle" class="x">équipe de la machine</text>
  <text x="830" y="378" text-anchor="middle" class="x">priorité haute</text>
  <text x="830" y="395" text-anchor="middle" class="x">aucune date planifiée</text>

  <!-- Flux -->
  <path d="M300 95 L358 95" class="flux" marker-end="url(#fl)"/>
  <path d="M640 95 L698 95" class="flux" marker-end="url(#fl)"/>
  <path d="M830 150 L830 188" class="flux" marker-end="url(#fl)"/>
  <path d="M700 220 L602 220" class="flux" marker-end="url(#fl)"/>
  <path d="M400 220 L272 220" class="flux" marker-end="url(#fl)"/>
  <text x="336" y="212" text-anchor="middle" class="l">non</text>
  <path d="M500 265 L500 303" class="flux" marker-end="url(#fl)"/>
  <text x="512" y="290" class="l">oui</text>
  <path d="M385 350 L272 350" class="flux" marker-end="url(#fl)"/>
  <text x="328" y="342" text-anchor="middle" class="l">oui</text>
  <path d="M615 350 L698 350" class="flux" marker-end="url(#fl)"/>
  <text x="656" y="342" text-anchor="middle" class="l">non</text>

  <!-- Décision humaine -->
  <rect x="30" y="435" width="940" height="160" rx="12" fill="#F2F7FD" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="500" y="462" text-anchor="middle" class="t">Ensuite, décision humaine du responsable maintenance (la plateforme ne planifie jamais)</text>

  <rect x="80" y="482" width="390" height="95" rx="9" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="1.8"/>
  <text x="275" y="507" text-anchor="middle" class="t">Bouton « Valider et créer la demande »</text>
  <text x="275" y="530" text-anchor="middle" class="x">alerte → « Traitée »</text>
  <text x="275" y="548" text-anchor="middle" class="x">demande créée, ou rattachée si une demande est ouverte</text>
  <text x="275" y="566" text-anchor="middle" class="x">le responsable planifie ensuite lui-même</text>

  <rect x="530" y="482" width="390" height="95" rx="9" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.8"/>
  <text x="725" y="507" text-anchor="middle" class="t">Bouton « Fausse alerte »</text>
  <text x="725" y="530" text-anchor="middle" class="x">alerte → « Fausse alerte »</text>
  <text x="725" y="548" text-anchor="middle" class="x">sert à mesurer le taux de fausses alertes (KPI)</text>
  <text x="725" y="566" text-anchor="middle" class="x">et à comparer seuils fixes et modèle prédictif</text>
</svg>
