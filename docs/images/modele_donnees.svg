<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Modèle de données du module predimaint</title>
  <defs>
    <style>
      .t  { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .s  { font-size: 10.5px; fill: #FFFFFF; opacity: .9; }
      .f  { font-size: 11.5px; fill: #1F2933; }
      .m  { font-size: 11.5px; fill: #1F2933; font-style: italic; }
      .c  { font-size: 10.5px; fill: #52606D; }
      .lien { stroke: #52606D; stroke-width: 1.6; fill: none; }
      .card { font-size: 11px; font-weight: 700; fill: #52606D; }
    </style>
  </defs>
  <rect width="1000" height="470" fill="#FFFFFF"/>
  <text x="500" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2933">Modèle de données du module predimaint</text>

  <!-- Catégorie (standard) -->
  <rect x="30" y="50" width="240" height="78" rx="8" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1.5"/>
  <rect x="30" y="50" width="240" height="38" rx="8" fill="#8A94A0"/><rect x="30" y="78" width="240" height="10" fill="#8A94A0"/>
  <text x="150" y="68" text-anchor="middle" class="t">maintenance.equipment.category</text>
  <text x="150" y="83" text-anchor="middle" class="s">standard, non modifié</text>
  <text x="44" y="106" class="f">4 catégories : presses, compresseurs,</text>
  <text x="44" y="121" class="f">convoyeurs, pompes</text>

  <!-- Seuils (nouveau) -->
  <rect x="30" y="215" width="240" height="180" rx="8" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="1.5"/>
  <rect x="30" y="215" width="240" height="38" rx="8" fill="#2E9E5B"/><rect x="30" y="243" width="240" height="10" fill="#2E9E5B"/>
  <text x="150" y="233" text-anchor="middle" class="t">predimaint.sensor.threshold</text>
  <text x="150" y="248" text-anchor="middle" class="s">nouveau modèle</text>
  <text x="44" y="275" class="f">category_id · catégorie</text>
  <text x="44" y="294" class="f">measure_type · grandeur</text>
  <text x="44" y="313" class="f">alert_threshold · seuil d'alerte</text>
  <text x="44" y="332" class="f">critical_threshold · seuil critique</text>
  <text x="44" y="351" class="f">unit · unité</text>
  <text x="44" y="378" class="c">contrainte : critique &gt; alerte</text>

  <!-- Équipement (héritage) -->
  <rect x="345" y="50" width="290" height="260" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
  <rect x="345" y="50" width="290" height="38" rx="8" fill="#2B6CB0"/><rect x="345" y="78" width="290" height="10" fill="#2B6CB0"/>
  <text x="490" y="68" text-anchor="middle" class="t">maintenance.equipment</text>
  <text x="490" y="83" text-anchor="middle" class="s">héritage (_inherit) : champs ajoutés</text>
  <text x="359" y="110" class="f">sensor_ref · identifiant capteur (PRESSE-01…)</text>
  <text x="359" y="129" class="f">health_score · score de santé 0 à 100</text>
  <text x="359" y="148" class="f">health_state · état (calculé, stocké)</text>
  <text x="359" y="164" class="c">   ≥ 70 Normal · 40 à 70 Surveillance · &lt; 40 Critique</text>
  <text x="359" y="185" class="f">last_measure_date · dernière mesure</text>
  <text x="359" y="204" class="f">pm_mtbf_hours · MTBF capteurs (h)</text>
  <text x="359" y="223" class="f">availability_rate · disponibilité (%)</text>
  <text x="359" y="242" class="f">alert_ids, alert_count · alertes</text>
  <text x="359" y="261" class="f">threshold_ids · seuils de la catégorie</text>
  <text x="359" y="290" class="c">vue : onglet « Santé » ajouté par xpath</text>

  <!-- Alerte (nouveau) -->
  <rect x="710" y="50" width="260" height="285" rx="8" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="1.5"/>
  <rect x="710" y="50" width="260" height="38" rx="8" fill="#2E9E5B"/><rect x="710" y="78" width="260" height="10" fill="#2E9E5B"/>
  <text x="840" y="68" text-anchor="middle" class="t">predimaint.alert</text>
  <text x="840" y="83" text-anchor="middle" class="s">nouveau modèle</text>
  <text x="724" y="110" class="f">name · référence ALR0001 (séquence)</text>
  <text x="724" y="129" class="f">equipment_id · équipement</text>
  <text x="724" y="148" class="f">measure_type, value, threshold, unit</text>
  <text x="724" y="167" class="f">severity · surveillance / critique</text>
  <text x="724" y="186" class="f">alert_date · date de l'alerte</text>
  <text x="724" y="205" class="f">state · Nouvelle / Traitée / Fausse alerte</text>
  <text x="724" y="224" class="f">request_id · demande liée</text>
  <line x1="724" y1="236" x2="956" y2="236" stroke="#D9E2EC"/>
  <text x="724" y="256" class="m">create_from_api(vals)  · appel XML-RPC</text>
  <text x="724" y="275" class="m">action_validate()  · « Valider et créer… »</text>
  <text x="724" y="294" class="m">action_false_alarm()  · « Fausse alerte »</text>
  <text x="724" y="319" class="c">droits : lecture utilisateurs, tout responsable</text>

  <!-- Demande (héritage) -->
  <rect x="345" y="355" width="290" height="100" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
  <rect x="345" y="355" width="290" height="38" rx="8" fill="#2B6CB0"/><rect x="345" y="383" width="290" height="10" fill="#2B6CB0"/>
  <text x="490" y="373" text-anchor="middle" class="t">maintenance.request</text>
  <text x="490" y="388" text-anchor="middle" class="s">héritage (_inherit)</text>
  <text x="359" y="414" class="f">maintenance_type + « Prédictive » (selection_add)</text>
  <text x="359" y="433" class="f">alert_id · alerte d'origine ; alert_ids · rattachées</text>

  <!-- Liens -->
  <path d="M270 89 L345 89" class="lien"/>
  <text x="278" y="83" class="card">1</text><text x="333" y="83" class="card">n</text>
  <path d="M150 128 L150 215" class="lien"/>
  <text x="157" y="145" class="card">1</text><text x="157" y="208" class="card">n</text>
  <path d="M635 129 L710 129" class="lien"/>
  <text x="643" y="123" class="card">1</text><text x="698" y="123" class="card">n</text>
  <path d="M840 335 L840 405 L635 405" class="lien"/>
  <text x="848" y="352" class="card">n</text><text x="645" y="399" class="card">1</text>
  <text x="852" y="395" class="c">alertes rattachées</text>
  <text x="852" y="409" class="c">à une même demande</text>

  <!-- Légende -->
  <rect x="30" y="425" width="14" height="14" rx="3" fill="#8A94A0"/><text x="50" y="436" class="c">standard Odoo</text>
  <rect x="140" y="425" width="14" height="14" rx="3" fill="#2B6CB0"/><text x="160" y="436" class="c">étendu par héritage</text>
  <rect x="30" y="447" width="14" height="14" rx="3" fill="#2E9E5B"/><text x="50" y="458" class="c">nouveau modèle du module</text>
</svg>
